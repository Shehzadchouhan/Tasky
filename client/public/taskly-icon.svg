<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Dark Rounded Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="#09090b" />
  <rect x="4" y="4" width="120" height="120" rx="32" stroke="#ffcc00" stroke-opacity="0.2" stroke-width="2" />

  <!-- 3D Yellow Notepad / Clipboard Shadow & Body -->
  <rect x="36" y="24" width="56" height="74" rx="12" fill="#d9a500" />
  <rect x="32" y="20" width="56" height="74" rx="12" fill="#ffcc00" />

  <!-- Checklist Box 1 & Checkmark -->
  <rect x="40" y="32" width="12" height="12" rx="3" fill="#18181b" />
  <path d="M43 38 L45.5 40.5 L49 35" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="57" y1="36" x2="78" y2="36" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="57" y1="41" x2="72" y2="41" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Checklist Box 2 & Checkmark -->
  <rect x="40" y="48" width="12" height="12" rx="3" fill="#18181b" />
  <path d="M43 54 L45.5 56.5 L49 51" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="57" y1="52" x2="78" y2="52" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="57" y1="57" x2="70" y2="57" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Checklist Box 3 (Unchecked) -->
  <rect x="40" y="64" width="12" height="12" rx="3" fill="none" stroke="#18181b" stroke-width="2.5" />
  <line x1="57" y1="70" x2="76" y2="70" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Stylized Pencil -->
  <g transform="translate(68, 30) rotate(42)">
    <rect x="0" y="0" width="10" height="30" rx="3" fill="#ffd633" stroke="#18181b" stroke-width="1.5" />
    <path d="M0 30 L5 38 L10 30 Z" fill="#18181b" />
    <path d="M3 35 L5 38 L7 35 Z" fill="#ffffff" />
  </g>

  <!-- Sticky Note at Bottom Right -->
  <path d="M64 70 L94 67 L94 92 C94 96 90 98 86 98 L68 98 C64 98 62 95 62 92 L64 70 Z" fill="#ffdb4d" />
  <!-- Folded Corner -->
  <path d="M86 90 L94 90 L86 98 Z" fill="#d9a500" />
  <line x1="68" y1="76" x2="88" y2="74" stroke="#18181b" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="82" x2="84" y2="81" stroke="#18181b" stroke-width="2" stroke-linecap="round" />
</svg>
